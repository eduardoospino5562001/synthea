name: Compare Synthea populations

on:
  pull_request:
    branches:
      - master
      - demo/pr-compare

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: UTC
  SQ_SHA: '9ab46aee5ab9e9b5946675b8390c2173ac6287d1'
  SEED: '1'
  POPULATION: '1000'
  REFERENCE_DATE: '20260101'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Check out synthea-quality
        uses: actions/checkout@v7
        with:
          repository: eduardoospino5562001/synthea-quality
          ref: ${{ env.SQ_SHA }}
          path: sq
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build the base revision
        working-directory: base
        run: ./gradlew assemble

      - name: Build the PR revision
        working-directory: pr
        run: ./gradlew assemble

      - name: Install synthea-quality in a dedicated environment
        run: |
          python -m venv "$RUNNER_TEMP/sq-venv"
          "$RUNNER_TEMP/sq-venv/bin/pip" install ./sq
          echo "$RUNNER_TEMP/sq-venv/bin" >> "$GITHUB_PATH"

      - name: Verify the comparison executable and version
        run: |
          compare_path="$(command -v synthea-compare)"
          printf 'synthea-compare path: %s\n' "$compare_path"
          test "$compare_path" = "$RUNNER_TEMP/sq-venv/bin/synthea-compare"
          compare_version="$(synthea-compare --version)"
          printf 'synthea-compare version: %s\n' "$compare_version"
          test "$compare_version" = 'synthea-compare (synthea-quality 0.15.1)'

      - name: Generate and compare matching populations
        run: >-
          sq/scripts/pr_compare.sh base pr sq/examples/myocardial_infarction.json
          "$SEED" "$POPULATION" "$RUNNER_TEMP/out" "$REFERENCE_DATE"

      - name: Measure the Markdown report
        run: |
          python3 -c '
          import os
          from pathlib import Path

          data = Path(os.environ["RUNNER_TEMP"], "out", "synthea_compare.md").read_bytes()
          report = data.decode("utf-8")
          print("Report characters:", len(report))
          print("Report UTF-16 units:", len(report.encode("utf-16-le")) // 2)
          print("Report bytes:", len(data))
          '

      - name: Format the PR comment
        run: |
          python3 sq/scripts/pr_comment.py "$RUNNER_TEMP/out/synthea_compare.md" > "$RUNNER_TEMP/comment.md"

      - name: Measure CSV exports for the artifact
        id: csv-size
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          out_dir = Path(os.environ["RUNNER_TEMP"], "out")
          csv_bytes = sum(path.stat().st_size for path in out_dir.rglob("*.csv"))
          print(f"CSV exports: {csv_bytes} bytes (100 MB limit: 100000000 bytes)")
          exclusion = ""
          if csv_bytes > 100_000_000:
              print("CSV exports exceed 100 MB and will be excluded from the artifact.")
              exclusion = f"!{out_dir}/**/*.csv"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"csv_exclusion={exclusion}\n")
          PY

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment "${{ github.event.pull_request.number }}"
          --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Upload the comparison report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthea-compare-report
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/comment.md
            ${{ steps.csv-size.outputs.csv_exclusion }}
